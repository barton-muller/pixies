<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3a22">
<title>Pixies Score Pad</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="banner">
  <img class="logo" src="img/logo.png" alt="Pixies" width="655" height="275">
  <span class="sub-title">score pad</span>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="game" class="on">Game</button>
  <button role="tab" data-tab="stats">Stats</button>
</nav>

<main>
  <section id="view-setup" hidden></section>
  <section id="view-game" hidden></section>
  <section id="view-stats" hidden></section>
</main>

<dialog id="dlg"></dialog>

<script src="app.js"></script>
</body>
</html>
